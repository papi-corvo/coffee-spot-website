<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Spot | Admin Portal</title>
  
  <!-- Reuse existing global and login styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/loginform.css">
  
  <!-- Load the new admin-specific styles -->
  <link rel="stylesheet" href="css/admin-login.css">
</head>

<body class="lg-body">
  <main class="lg-card">
    
    <div class="lg-brand">
      <span class="lg-mark">CS</span>
      <div>
        <strong>Coffee Spot</strong>
        <small>Store Management</small>
      </div>
      <span class="lg-admin-badge">Admin</span>
    </div>

    <h1>Welcome back</h1>
    <p class="lg-sub">Sign in to manage your store, menu, and staff.</p>

    <form id="adminLoginForm" novalidate>
      
      <label class="lg-field">Email Address
        <input id="adEmail" type="email" autocomplete="email" placeholder="owner@coffeespot.com" required>
      </label>

      <label class="lg-field">Password
        <input id="adPassword" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </label>

      <p class="lg-error" id="adError" role="alert" hidden></p>

      <button class="lg-submit" id="adSubmit" type="submit">Sign in to Dashboard</button>
    </form>

    <div class="lg-links">
      <a href="#">Forgot password?</a>
      <a href="loginform.html">← Cashier Login</a>
    </div>

  </main>

  <script src="js/admin-login.js" defer></script>
</body>
</html>
