<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Spot | Staff Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/loginform.css">
</head>

    <!-- REGISTER -->
<body>
    <section id="viewRegister" hidden>
      <h1>Create your account</h1>
      <p class="lg-sub">Set up your employee ID and a PIN to sign in to the cashier.</p>

      <form id="rgForm" novalidate>
        <label class="lg-field">Full name
          <input id="rgName" type="text" autocomplete="name" required>
        </label>

        <label class="lg-field">Employee ID
          <input id="rgCode" type="text" autocomplete="username" autocapitalize="characters" required>
        </label>

        <label class="lg-field">PIN
          <input id="rgPin" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="8" required>
        </label>

        <label class="lg-field">Confirm PIN
          <input id="rgPin2" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="8" required>
        </label>

        <p class="lg-error" id="rgError" role="alert" hidden></p>
        <p class="lg-success" id="rgSuccess" role="status" hidden></p>

        <button class="lg-submit" id="rgSubmit" type="submit">Create account</button>
      </form>

      <p class="lg-switch">Already registered? <a href="#login" class="lg-link" data-view="login">Back to sign in</a></p>
    </section>
  </main>
  </body>

    <script src="js/loginform.js" defer></script>
